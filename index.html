<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO meta tags -->
  <meta name="description" content="Scott Blackmore's personal website featuring a portfolio, gallery, music updates and contact information." />
  <meta name="keywords" content="Scott Blackmore, personal website, gallery, music, developer, portfolio" />
  <meta name="author" content="Scott Blackmore" />
  <!-- Open Graph tags for social sharing -->
  <meta property="og:title" content="Scott Blackmore" />
  <meta property="og:description" content="Visit the personal site of Scott Blackmore to explore his work, gallery and music." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://scottblackmore.com/" />
  <meta property="og:image" content="https://scottblackmore.com/assets/images/profile/profile.png" />
  <!-- Canonical URL to avoid duplicate content issues -->
  <link rel="canonical" href="https://scottblackmore.com/" />
  <title>Scott Blackmore</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  <!-- Two font families: one for headings and one for body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/main.js" defer></script>

  <!-- Google Analytics integration -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5WFGHP1K36"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-5WFGHP1K36');
  </script>
</head>
<body>
  <!-- Shared header -->
  <header class="header">
    <div class="logo"><a href="/">SB</a></div>
    <nav class="nav" id="site-nav" aria-label="Main">
      <ul>
        <li><a href="/" aria-current="page">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/gallery">Gallery</a></li>
        <li><a href="/music">Music</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
    <button class="drive-toggle" type="button" data-night-drive aria-label="Take a night drive" title="Take a night drive"><svg aria-hidden="true"><use href="/assets/images/icons.svg#car" /></svg></button>
    <button class="hamburger" type="button" aria-label="Menu" aria-controls="site-nav" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main class="home">
    <div class="home-container">
      <div class="home-image">
        <img
          src="/assets/images/profile/profile.webp"
          alt="Portrait of Scott"
          class="profile-img"
          width="600"
          height="804"
          fetchpriority="high"
        />
      </div>
      <div class="home-text">
        <h2 class="greeting">Hi!</h2>
        <h1 class="name">I'm Scott</h1>
        <div class="social-icons">
          <a href="https://x.com/Jegethy" target="_blank" rel="noopener" aria-label="X (Twitter)"><svg aria-hidden="true"><use href="/assets/images/icons.svg#twitter" /></svg></a>
          <a href="https://www.instagram.com/scottrblackmore" target="_blank" rel="noopener" aria-label="Instagram"><svg aria-hidden="true"><use href="/assets/images/icons.svg#instagram" /></svg></a>
          <a href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg aria-hidden="true"><use href="/assets/images/icons.svg#linkedin" /></svg></a>
          <a href="https://github.com/ScottBlackmore" target="_blank" rel="noopener" aria-label="GitHub"><svg aria-hidden="true"><use href="/assets/images/icons.svg#github" /></svg></a>
        </div>
        <button class="button drive-cta" type="button" data-night-drive>
          <svg aria-hidden="true"><use href="/assets/images/icons.svg#car" /></svg>
          Take a night drive
        </button>
      </div>
    </div>
  </main>

  <!-- Shared footer -->
  <footer class="footer">
    <div class="copyright">
      © <span class="year">2026</span> Scott Blackmore. All rights reserved.
      <a class="rabbit-link" href="https://en.wikipedia.org/wiki/Special:Random" target="_blank" rel="noopener" data-rabbit-hole>Fall down a rabbit hole</a>
    </div>
    <div class="footer-social">
      <a href="https://x.com/Jegethy" target="_blank" rel="noopener" aria-label="X (Twitter)"><svg aria-hidden="true"><use href="/assets/images/icons.svg#twitter" /></svg></a>
      <a href="https://www.instagram.com/scottrblackmore" target="_blank" rel="noopener" aria-label="Instagram"><svg aria-hidden="true"><use href="/assets/images/icons.svg#instagram" /></svg></a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg aria-hidden="true"><use href="/assets/images/icons.svg#linkedin" /></svg></a>
      <a href="https://github.com/ScottBlackmore" target="_blank" rel="noopener" aria-label="GitHub"><svg aria-hidden="true"><use href="/assets/images/icons.svg#github" /></svg></a>
    </div>
  </footer>
</body>
</html>
