<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- SEO meta tags -->
  <meta name="description" content="Music releases and updates from Scott Blackmore – stay tuned for new tracks." />
  <meta name="keywords" content="Scott Blackmore music, music page, coming soon" />
  <meta name="author" content="Scott Blackmore" />
  <!-- Open Graph tags for social sharing -->
  <meta property="og:title" content="Music – Scott Blackmore" />
  <meta property="og:description" content="Listen to and follow Scott's upcoming music projects." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://scottblackmore.com/music" />
  <meta property="og:image" content="https://scottblackmore.com/assets/images/profile/profile.png" />
  <!-- Canonical URL to avoid duplicate content issues -->
  <link rel="canonical" href="https://scottblackmore.com/music" />
  <title>Music – Scott Blackmore</title>
  <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@400;500&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/main.js" defer></script>
  <script type="module" src="/music.js"></script>

  <!-- Google Analytics integration -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5WFGHP1K36"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-5WFGHP1K36');
  </script>
</head>
<body>
  <!-- Shared header -->
  <header class="header">
    <div class="logo"><a href="/">SB</a></div>
    <nav class="nav" id="site-nav" aria-label="Main">
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/gallery">Gallery</a></li>
        <li><a href="/music" aria-current="page">Music</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
    </nav>
    <button class="drive-toggle" type="button" data-night-drive aria-label="Take a night drive" title="Take a night drive"><svg aria-hidden="true"><use href="/assets/images/icons.svg#car" /></svg></button>
    <button class="hamburger" type="button" aria-label="Menu" aria-controls="site-nav" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- Content is populated from Last.fm by music.js -->
  <main class="music">
    <div class="music-container">
      <div class="now-playing-block">
        <div class="now-playing-content">
          <img
            id="now-playing-art"
            src="/assets/images/music/album-placeholder.svg"
            alt=""
            width="200"
            height="200"
            decoding="async"
            referrerpolicy="no-referrer"
          />
          <div class="now-playing-info" aria-live="polite">
            <p id="now-playing-label" class="now-playing-label">Now Playing</p>
            <p id="now-playing-song" class="song-title">Loading…</p>
            <p id="now-playing-artist" class="artist-name"></p>
            <p id="now-playing-plays" class="play-count"></p>
          </div>
        </div>
      </div>
      <div class="top-lists">
        <div class="top-list">
          <h3>Top Artists (30 days)</h3>
          <ul id="top-artists-month">
            <li>Loading…</li>
          </ul>
        </div>
        <div class="top-list">
          <h3>Top Tracks (30 days)</h3>
          <ul id="top-tracks-month">
            <li>Loading…</li>
          </ul>
        </div>
      </div>
      <div class="lastfm-link-wrapper">
        <a href="https://www.last.fm/user/Jegethy" target="_blank" rel="noopener" class="lastfm-button">See more on Last.fm</a>
      </div>
    </div>
  </main>

  <!-- Shared footer -->
  <footer class="footer">
    <div class="copyright">
      © <span class="year">2026</span> Scott Blackmore. All rights reserved.
      <a class="rabbit-link" href="https://en.wikipedia.org/wiki/Special:Random" target="_blank" rel="noopener" data-rabbit-hole>Fall down a rabbit hole</a>
    </div>
    <div class="footer-social">
      <a href="https://x.com/Jegethy" target="_blank" rel="noopener" aria-label="X (Twitter)"><svg aria-hidden="true"><use href="/assets/images/icons.svg#twitter" /></svg></a>
      <a href="https://www.instagram.com/scottrblackmore" target="_blank" rel="noopener" aria-label="Instagram"><svg aria-hidden="true"><use href="/assets/images/icons.svg#instagram" /></svg></a>
      <a href="https://www.linkedin.com/" target="_blank" rel="noopener" aria-label="LinkedIn"><svg aria-hidden="true"><use href="/assets/images/icons.svg#linkedin" /></svg></a>
      <a href="https://github.com/ScottBlackmore" target="_blank" rel="noopener" aria-label="GitHub"><svg aria-hidden="true"><use href="/assets/images/icons.svg#github" /></svg></a>
    </div>
  </footer>
</body>
</html>
